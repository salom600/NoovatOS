#
# /etc/pacman.conf for NovatOS archiso build
# Configures the repositories used during the live ISO build.
#

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace        = false
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
DownloadUser      = alpm
DisableDownloadTimeout

# Core Arch repositories
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

# Chaotic-AUR — prebuilt packages for gaming / media / desktop tools
# Required so we can install things like: gaming-utils, wine-ge-custom,
# protonup-qt, waydroid, etc. without compiling them in CI.
[chaotic-aur]
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
SigLevel = Optional TrustAll

# Arch Linux ZFS (optional, disabled by default — uncomment if needed)
#[archzfs]
#Server = https://archzfs.com/$repo/$arch
#SigLevel = Optional TrustAll
