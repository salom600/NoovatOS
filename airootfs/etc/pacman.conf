# NovatOS — system-wide pacman.conf (installed inside the live ISO and the
# installed system). Mirrors the build-time pacman.conf but without the
# chaotic-aur repo (users add it via the bauh store on demand, or it stays
# for binary-only packages shipped on the ISO).

[options]
HoldPkg           = pacman glibc
Architecture      = auto
CheckSpace        = true
SigLevel          = Required DatabaseOptional
LocalFileSigLevel = Optional
ParallelDownloads = 5
Color
VerbosePkgLists
ILoveCandy

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
Server = https://cdn-mirror.chaotic.cx/$repo/$arch
SigLevel = Optional TrustAll
