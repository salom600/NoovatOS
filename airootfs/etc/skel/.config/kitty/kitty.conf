# NovatOS kitty terminal — minimal config, GPU-accelerated
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size 11.0

window_padding_width 6
window_padding_height 4
background_opacity 0.92
background_blur 8

cursor_shape beam
cursor_blink_interval 0.5

scrollback_lines 10000
enable_audio_bell no

# NovatOS color scheme (dark, blue accent)
foreground              #cdd6f4
background              #14141f
selection_foreground    #14141f
selection_background    #4cc2ff

color0  #45475a
color1  #f38ba8
color2  #a6e3a1
color3  #f9e2af
color4  #89b4fa
color5  #f5c2e7
color6  #94e2d5
color7  #bac2de
color8  #585b70
color9  #f38ba8
color10 #a6e3a1
color11 #f9e2af
color12 #89b4fa
color13 #f5c2e7
color14 #94e2d5
color15 #a6adc8

tab_bar_min_tabs            1
tab_bar_edge                bottom
tab_bar_style               powerline
tab_powerline_style         slanted
tab_title_template          {title}{' :{}:'.format(num_windows) if num_windows > 1 else ''}
active_tab_foreground       #1e1e2e
active_tab_background       #4cc2ff
inactive_tab_foreground     #cdd6f4
inactive_tab_background     #45475a
