# NovatOS Hyprlock — Windows 11-inspired lock screen
background {
    monitor =
    path = /usr/share/wallpapers/novatos/default.jpg
    blur_size = 4
    blur_passes = 2
    noise = 0.01
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.2
    vibrancy_darkness = 0.4
}

input-field {
    monitor =
    size = 280, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.4
    dots_center = true
    outer_color = rgba(76, 194, 255, 0.6)
    inner_color = rgba(20, 20, 32, 0.6)
    font_color = #cdd6f4
    fade_on_empty = true
    placeholder_text = <i>Enter password</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = Welcome to NovatOS
    color = rgba(255, 255, 255, 0.85)
    font_size = 32
    font_family = Roboto
    position = 0, 80
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = rgba(255, 255, 255, 0.75)
    font_size = 56
    font_family = Roboto Mono
    position = 0, 200
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:3600000] date +"%A, %B %d"
    color = rgba(255, 255, 255, 0.55)
    font_size = 18
    font_family = Roboto
    position = 0, 160
    halign = center
    valign = center
}
