# ============================================================
#  NovatOS — Hyprland configuration (Windows 11 inspired)
#  Target: idle RAM < 350 MB on 2 GB / 2009-era systems.
# ============================================================

# ----- Auto-detect GPU & pick the right renderer -----
# (handled by /etc/novatos/scripts/detect-gpu at login)

monitor=,preferred,auto,1

# ----- Input -----
input {
    kb_layout = us,ar
    kb_variant =
    kb_model =
    kb_options = grp:alt_shift_toggle
    kb_rules =
    repeat_rate = 40
    repeat_delay = 300
    follow_mouse = 1
    touchpad {
        natural_scroll = yes
        tap-to-click = yes
        clickfinger_behavior = yes
        middle_button_emulation = yes
    }
    sensitivity = 0
}

# ----- Gestures (laptops) -----
gestures {
    workspace_swipe = yes
    workspace_swipe_distance = 200
    workspace_swipe_fingers = 3
}

# ----- Look & feel (Windows 11-ish: subtle rounded corners, soft shadows) -----
general {
    gaps_in = 4
    gaps_out = 6
    border_size = 2
    col.active_border = rgba(0067c0ff)
    col.inactive_border = rgba(3f3f46ff)
    layout = dwindle
    no_cursor_warps = false
}

decoration {
    rounding = 8
    blur {
        enabled = true
        size = 3
        passes = 1
        new_optimizations = true
    }
    drop_shadow = yes
    shadow_range = 8
    shadow_render_power = 2
    col.shadow = rgba(00000055)
    dim_inactive = false
}

animations {
    enabled = yes
    bezier = win11, 0.1, 0.9, 0.2, 1.0
    animation = windows, 1, 4, win11, slide
    animation = windowsOut, 1, 4, win11, slide
    animation = windowsMove, 1, 3, win11
    animation = fade, 1, 4, win11
    animation = border, 1, 6, win11
    animation = workspaces, 1, 4, win11, slidefade
    animation = layers, 1, 4, win11, slide
}

# ----- Behavior -----
dwindle {
    pseudotile = yes
    preserve_split = yes
    no_gaps_when_only = false
    smart_split = yes
    smart_resizing = yes
}

master {
    new_status = master
    mfact = 0.5
}

misc {
    disable_hyprland_logo = yes
    disable_splash_rendering = yes
    force_default_wallpaper = 0
    vfr = 1
    vrr = 0
    mouse_move_enables_dpms = yes
    key_press_enables_dpms = yes
    enable_swallow = yes
    swallow_regex = ^(kitty|foot|Alacritty)$
}

# ----- Window rules -----
windowrule = float,^(wofi)$
windowrule = center,^(wofi)$
windowrule = float,^(pavucontrol)$
windowrule = float,^(blueman-manager)$
windowrule = float,^(nm-connection-editor)$
windowrule = float,^(thunar)$
windowrule = float,^(galculator)$
windowrule = float,^(org.gnome.Calculator)$
windowrule = float,^(wlogout)$
windowrule = float,^(novatos-welcome)$
windowrule = float,^(bauh)$
windowrule = center,^(bauh)$
windowrule = float, title:^(File Operation Progress)$
windowrule = float, title:^(Confirm to replace files)$
windowrule = animation popin,^(wofi)$
windowrule = animation popin,^(pavucontrol)$

# ----- Exec on launch -----
exec-once = /etc/novatos/scripts/detect-gpu
exec-once = waybar
exec-once = hyprpaper
exec-once = /usr/lib/xdg-desktop-portal-hyprland
exec-once = /usr/lib/xdg-desktop-portal
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = systemctl --user start xdg-desktop-portal
exec-once = nm-applet --indicator
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = swayidle -w timeout 600 'hyprlock' timeout 1200 'hyprctl dispatch dpms off' resume 'hyprctl dispatch dpms on' before-sleep 'hyprlock'
exec-once = wl-paste --watch cliphist store
exec-once = novatos-first-boot
exec-once = [workspace 1] novatos-welcome

# ----- Keybindings (Super = Windows key, very Windows-migrant friendly) -----
$mod = SUPER

# Apps
bind = $mod, Return, exec, kitty
bind = $mod SHIFT, Return, exec, foot
bind = $mod, E, exec, thunar
bind = $mod, W, exec, firefox
bind = $mod, space, exec, wofi --show drun --prompt "Start menu"
bind = $mod SHIFT, E, exec, wlogout
bind = $mod, P, exec, novatos-screenshot
bind = $mod SHIFT, P, exec, novatos-screenshot --region
bind = $mod, C, exec, novatos-launcher
bind = $mod, A, exec, bauh
bind = CTRL SHIFT ESC, code:41, exec, btop
bind = $mod, F11, exec, fullscreen

# Window control
bind = $mod, Q, killactive,
bind = $mod SHIFT, Q, exit,
bind = $mod, F, togglefloating,
bind = $mod SHIFT, F, fullscreen,
bind = $mod, T, togglesplit,
bind = $mod, M, togglesplit,
bind = $mod, Tab, cyclenext,
bind = $mod SHIFT, Tab, cyclenext, prev

# Split-screen snap (Windows 11 snap layouts)
bind = $mod, Left, moveactive, 0 0
bind = $mod, Right, moveactive, 0 0
bind = $mod SHIFT, Left, exec, hyprctl dispatch movewindow l
bind = $mod SHIFT, Right, exec, hyprctl dispatch movewindow r
bind = $mod SHIFT, Up, exec, hyprctl dispatch movewindow u
bind = $mod SHIFT, Down, exec, hyprctl dispatch movewindow d

# Focus
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d
bind = ALT, Tab, movefocus, l

# Workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Scroll workspaces
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up, workspace, e-1

# Media keys
bind = , XF86AudioRaiseVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ +5%
bind = , XF86AudioLowerVolume, exec, pactl set-sink-volume @DEFAULT_SINK@ -5%
bind = , XF86AudioMute, exec, pactl set-sink-mute @DEFAULT_SINK@ toggle
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous
bind = , XF86AudioStop, exec, playerctl stop
bind = , XF86MonBrightnessUp, exec, brightnessctl set +10%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 10-%
bind = , XF86PowerOff, exec, wlogout -p power

# Mouse
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Source modular config
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/novatos-keybinds.conf
