# Calamares — contextualprocess module: post-install actions
# Runs novatos-specific commands on the installed system (chroot).

dontChroot: false

commands:
  # Detect GPU and install correct driver on installed system
  - command: "/etc/novatos/scripts/detect-gpu"
    timeout: 60

  # Set up flatpak remotes + bauh defaults on installed system
  - command: "/etc/novatos/scripts/setup-flatpak-remotes"
    timeout: 120

  # Apply theme defaults for the new user (already copied via skel)
  - command: "chmod 0755 /usr/local/bin/novatos-* /etc/novatos/scripts/*"
    timeout: 5
