# Calamares — displaymanager module (configures SDDM on the installed system)
displaymanagers:
  - sddm

sddm:
  configurationFile: /etc/sddm.conf
  autoLoginUser: ""    # Set during install — defaults to created user

# Don't try to autologin on the installed system (security)
autoLoginEnable: false

# Set up the SDDM theme
sddmTheme: novatos

# What session to use
defaultDesktopEnvironment:
  executable: "Hyprland"
  desktopFile: "hyprland"
