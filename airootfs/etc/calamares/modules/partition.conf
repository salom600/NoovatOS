# Calamares — partition module
# Allow: replace a partition, alongside, erase disk, manual
defaultFsType: btrfs

availableFileSystemTypes:
  - btrfs
  - ext4
  - xfs
  - f2fs

partitionLayout:
  - name: "EFI"
    filesystem: fat32
    mountPoint: "/boot/efi"
    size: 512M
    minSize: 256M
    maxSize: 1024M
    flags: [ boot, esp ]
  - name: "Root"
    filesystem: btrfs
    mountPoint: "/"
    size: 100%

allowManualPartitioning: true

initialPartitioningChoice: alongside   # Default: install alongside existing OS
initialSwapChoice: small               # Default: small swap (hibernation-friendly)
