# Calamares — bootloader module (installs GRUB + systemd-boot for hybrid boot)
efiBootLoader: grub

kernel: "/boot/vmlinuz-linux"

# GRUB config
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubConfig: "/etc/default/grub"
grubProbe: "grub-probe"

# systemd-boot fallback (if UEFI + GRUB fails)
systemd-boot-fallback: true

# Don't force a particular device — let user pick in the partition step
installBootloader: true
