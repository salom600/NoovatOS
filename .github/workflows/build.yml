# ============================================================
#  NovatOS — CI/CD Build Pipeline
#  Builds the bootable hybrid ISO on every push, uploads the
#  ISO + checksums as a GitHub Actions artifact and (on main
#  push) creates a rolling GitHub Release.
# ============================================================
name: Build NovatOS ISO

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: novatos-iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-iso:
    name: Build NovatOS ISO (x86_64)
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up build environment
        run: |
          set -eu
          echo "BUILD_DATE=$(date +%Y.%m.%d)" >> $GITHUB_ENV
          echo "BUILD_TAG=$(date +%Y%m%d-%H%M)" >> $GITHUB_ENV
          df -h

      - name: Free up disk space
        run: |
          set -eu
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /usr/local/share/boost /usr/local/share/powershell \
                      /usr/local/share/chromium /usr/share/swift /opt/hostedtoolcache 2>/dev/null || true
          sudo apt-get -qq remove -y '^dotnet-.*' '^ghc-.*' '^llvm-.*' 'php.*' 'ruby.*' \
                                    'aspnetcore-*' azure-cli google-chrome-stable \
                                    microsoft-edge-stable firefox 2>/dev/null || true
          sudo apt-get -qq autoremove -y 2>/dev/null || true
          sudo apt-get -qq clean 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h

      - name: Build NovatOS ISO inside archlinux container
        run: |
          set -eu
          mkdir -p work out
          chmod +x scripts/build-iso.sh

          docker run --rm \
            --privileged \
            --cap-add SYS_ADMIN \
            -v "$PWD":/novatos \
            -v "$PWD/work":/work \
            -v "$PWD/out":/out \
            -w /novatos \
            -e BUILD_DATE="${BUILD_DATE}" \
            -e BUILD_TAG="${BUILD_TAG}" \
            archlinux:latest \
            bash /novatos/scripts/build-iso.sh

      - name: List built artifacts
        run: |
          ls -lah out/
          cat out/SHA256SUMS.txt || true

      - name: Upload ISO as Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: novatos-iso-${{ env.BUILD_TAG }}
          path: |
            out/*.iso
            out/SHA256SUMS.txt
          retention-days: 30
          compression-level: 0

      - name: Create GitHub Release (on main push)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rolling-${{ env.BUILD_TAG }}
          name: NovatOS Rolling Build ${{ env.BUILD_TAG }}
          body: |
            # NovatOS Rolling Build

            **Build date:** ${{ env.BUILD_DATE }}
            **Commit:** ${{ github.sha }}

            ## Download
            - Get the `.iso` file below
            - Verify with the SHA256 checksum in `SHA256SUMS.txt`

            ## How to use
            1. Flash the ISO to a USB stick with `dd` or Rufus / Ventoy / balenaEtcher
            2. Boot from the USB (BIOS or UEFI)
            3. Click "Install NovatOS" on the desktop to run Calamares
            4. Or just use the live environment — everything works out of the box

            ## What's inside
            - Hyprland (Wayland, ~250 MB RAM idle)
            - bauh app store (AUR + Flatpak + Snap + AppImage)
            - Steam / Proton / Wine installable from store
            - Full AMD/NVIDIA/Intel driver auto-detection
            - Calamares installer
            - Plymouth boot splash
            - Custom SDDM login screen
            - Windows-migrant welcome app + data migration tool
          files: |
            out/*.iso
            out/SHA256SUMS.txt
          prerelease: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            out/*.iso
            out/SHA256SUMS.txt
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
