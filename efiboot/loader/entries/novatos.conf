## GRUB config for NovatOS UEFI boot
set default=0
set timeout=30
set pager=1

insmod all_video
insmod gfxterm
insmod png
insmod progress
insmod regexp

set menu_color_normal=white/black
set menu_color_highlight=light-blue/black
set color_normal=white/black

loadfont /novatos/boot/grub/fonts/unicode.pf2

if [ -f "/novatos/boot/grub/splash.png" ]; then
    background_image -m stretch /novatos/boot/grub/splash.png
fi

menuentry "NovatOS (x86_64, UEFI)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --file /novatos/boot/x86_64/vmlinuz-linux
    linux /novatos/boot/x86_64/vmlinuz-linux archisobasedir=novatos archisolabel=%ARCHISO_LABEL% cow_spacesize=4G quiet splash plymouth.ignore-serial-consoles
    initrd /novatos/boot/intel-ucode.img /novatos/boot/amd-ucode.img /novatos/boot/x86_64/initramfs-linux.img
}

menuentry "NovatOS (fallback, no splash)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --file /novatos/boot/x86_64/vmlinuz-linux
    linux /novatos/boot/x86_64/vmlinuz-linux archisobasedir=novatos archisolabel=%ARCHISO_LABEL% cow_spacesize=4G
    initrd /novatos/boot/intel-ucode.img /novatos/boot/amd-ucode.img /novatos/boot/x86_64/initramfs-linux-fallback.img
}

menuentry "UEFI Shell" --class tools {
    insmod chain
    search --no-floppy --set=root --file /shellx64.efi
    chainloader /shellx64.efi
}

menuentry "Reboot" --class reboot {
    reboot
}

menuentry "Power Off" --class poweroff {
    halt
}
