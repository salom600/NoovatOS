DEFAULT arch
PROMPT 0
TIMEOUT 30

UI vesamenu.c32
MENU TITLE NovatOS Linux
MENU BACKGROUND /novatos/splash.png
MENU WIDTH 78
MENU MARGIN 4
MENU ROWS 6
MENU VSHIFT 10
MENU TIMEOUTROW 16
MENU TABMSGROW 14
MENU CMDLINEROW 14
MENU HELPMSGROW 18
MENU HELPMSGENDROW 22

MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #ffffffff #a0000000 std
MENU COLOR sel          7;37;40 #e0ffffff #20ffffff all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std
MENU COLOR timeout_msg  37;40   #80ffffff #00000000 std
MENU COLOR timeout      1;37;40 #c0ffffff #00000000 std
MENU COLOR msg07        37;40   #90ffffff #a0000000 std
MENU COLOR tabmsg       31;40   #30ffffff #00000000 std

LABEL arch
    MENU LABEL NovatOS (x86_64, UEFI)
    LINUX /novatos/boot/x86_64/vmlinuz-linux
    INITRD /novatos/boot/intel-ucode.img,/novatos/boot/amd-ucode.img,/novatos/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=novatos archisolabel=%ARCHISO_LABEL% cow_spacesize=4G quiet splash plymouth.ignore-serial-consoles

LABEL archbios
    MENU LABEL NovatOS (x86_64, BIOS)
    LINUX /novatos/boot/x86_64/vmlinuz-linux
    INITRD /novatos/boot/intel-ucode.img,/novatos/boot/amd-ucode.img,/novatos/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=novatos archisolabel=%ARCHISO_LABEL% cow_spacesize=4G quiet splash

LABEL archfallback
    MENU LABEL NovatOS (fallback, no splash)
    LINUX /novatos/boot/x86_64/vmlinuz-linux
    INITRD /novatos/boot/intel-ucode.img,/novatos/boot/amd-ucode.img,/novatos/boot/x86_64/initramfs-linux-fallback.img
    APPEND archisobasedir=novatos archisolabel=%ARCHISO_LABEL% cow_spacesize=4G

LABEL hdt
    MENU LABEL Hardware Information (HDT)
    COM32 hdt.c32

LABEL reboot
    MENU LABEL Reboot
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off
    COM32 poweroff.c32
